<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyberville Offline Excel</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0260fe">
<meta name="description" content="Cyberville Offline Excel — a fully offline spreadsheet that opens and re-saves .xlsx files while preserving formatting.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cyberville Excel">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  :root{--border:#d0d7de;--header:#f0f2f5;--accent:#0260fe;--accent-2:#00d4ff;--gridline:#e4e7eb;}
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:13px;color:#1f2328;}
  body{display:flex;flex-direction:column;overflow:hidden;}
  button{font:inherit;cursor:pointer;background:#fff;border:1px solid var(--border);border-radius:5px;padding:4px 9px;}
  button:hover{background:#f6f8fa;}
  button.primary{background:linear-gradient(120deg,#0260fe,#00d4ff);color:#fff;border-color:#0260fe;}
  button.on{background:#dcebfd;border-color:var(--accent);}
  select,input[type=text],input:not([type]){font:inherit;padding:4px 6px;border:1px solid var(--border);border-radius:5px;}
  input[type=color]{width:26px;height:24px;padding:0;border:1px solid var(--border);border-radius:5px;background:#fff;cursor:pointer;}
  input[type=color]:hover{border-color:var(--accent);}

  #menubar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  #menubar .appname{font-weight:700;font-size:14px;margin-right:8px;}
  #menubar .sep{width:1px;height:22px;background:var(--border);margin:0 4px;}
  #savedState{color:#818b98;font-size:12px;margin-left:auto;}

  #fmtbar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  #fmtbar .sep{width:1px;height:22px;background:var(--border);margin:0 4px;}
  #fmtbar .lbl{color:#57606a;font-size:12px;}

  #fxbar{display:flex;align-items:center;gap:6px;padding:5px 10px;background:#fff;border-bottom:1px solid var(--border);}
  #cellRef{min-width:70px;text-align:center;font-weight:600;color:#57606a;user-select:none;}
  #fxInput{flex:1;border:1px solid var(--border);border-radius:4px;padding:5px 7px;}
  .btn-group{display:flex;align-items:center;gap:4px;}
  .btn-group button{border-radius:5px 0 0 5px;}
  .btn-group button+button{border-radius:0 5px 5px 0;border-left:0;}

  #sheetWrap{flex:1;display:grid;grid-template-columns:48px 1fr;grid-template-rows:26px 1fr;overflow:hidden;position:relative;background:#fff;}
  #corner{border-right:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--header);cursor:pointer;z-index:4;}
  #colHead{grid-area:1/2;overflow:hidden;position:relative;background:var(--header);border-bottom:1px solid var(--border);z-index:3;}
  #rowHead{grid-area:2/1;overflow:hidden;position:relative;background:var(--header);border-right:1px solid var(--border);z-index:3;}
  #scroller{grid-area:2/2;overflow:hidden;position:relative;background:#fff;}
  #viewport{position:absolute;inset:0;overflow:auto;}
  #canvas{position:relative;}
  #frzCorner,#frzTop,#frzLeft{position:absolute;overflow:hidden;display:none;z-index:2;}
  #frzCorner{top:0;left:0;z-index:4;}
  #frzTop{top:0;z-index:3;}
  #frzLeft{left:0;z-index:3;}
  #colHeadFrozen{position:absolute;top:0;left:0;height:26px;overflow:hidden;z-index:5;display:none;}
  #rowHeadFrozen{position:absolute;top:0;left:0;width:48px;overflow:hidden;z-index:5;display:none;}
  .colResizer{position:absolute;top:0;bottom:0;width:5px;cursor:col-resize;z-index:6;}
  .rowResizer{position:absolute;left:0;right:0;height:5px;cursor:row-resize;z-index:6;}
  .colHeadCell{position:absolute;top:0;height:26px;border-right:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:600;color:#57606a;user-select:none;overflow:hidden;}
  .rowHeadCell{position:absolute;left:0;width:48px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:#57606a;user-select:none;overflow:hidden;}
  .rowHeadCell.hl,.colHeadCell.hl{background:#dcebfd;color:#1a73e8;}
  .cell{position:absolute;background:#fff;border-right:1px solid var(--gridline);border-bottom:1px solid var(--gridline);padding:0 4px;line-height:24px;white-space:nowrap;overflow:hidden;user-select:none;cursor:cell;z-index:1;}
  .cell.num{text-align:right;}
  .cell.err{color:#c62828;font-weight:600;}
  .cell.fml{color:#0b7285;}
  #selFill,#selBox{position:absolute;pointer-events:none;}
  #selBox{border:2px solid var(--accent);z-index:3;}
  #selFill{background:rgba(26,115,232,0.10);z-index:2;}
  #editor{border:2px solid var(--accent);position:absolute;z-index:10;font:inherit;padding:1px 4px;resize:none;overflow:hidden;white-space:pre;background:#fff;}
  .cell.hdrSel{background:#cfe0fa;}

  #tabsbar{display:flex;align-items:center;background:#f6f8fa;border-top:1px solid var(--border);height:34px;padding:0 4px;}
  #tabs{display:flex;height:100%;align-items:flex-end;overflow:hidden;}
  .tab{padding:5px 14px;border:1px solid transparent;border-radius:6px 6px 0 0;cursor:pointer;color:#57606a;display:flex;align-items:center;gap:6px;max-width:180px;user-select:none;height:100%;}
  .tab.active{background:#fff;border-color:var(--border);border-bottom-color:#fff;color:#1f2328;font-weight:600;}
  .tab .x{opacity:0;color:#818b98;font-size:12px;font-weight:400;}
  .tab:hover .x{opacity:1;}
  .tab .x:hover{color:#c62828;}
  #addTab{border:none;background:transparent;font-size:18px;color:#57606a;padding:0 10px;line-height:1;height:100%;}
  #addTab:hover{color:var(--accent);}
  #statusbar{display:flex;align-items:center;gap:16px;padding:3px 10px;background:#f6f8fa;border-top:1px solid var(--border);color:#57606a;font-size:12px;height:26px;}
  #statusbar .right{margin-left:auto;}

  #openFile{display:none;}
  #toast{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,40,50,.92);color:#fff;padding:8px 16px;border-radius:6px;opacity:0;transition:all .25s;pointer-events:none;z-index:99;font-size:13px;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #restoreBanner{display:none;padding:8px 12px;background:#fff8e1;border-bottom:1px solid #f0d96b;font-size:13px;align-items:center;gap:12px;}
  #restoreBanner.show{display:flex;}
  #restoreBanner .spacer{flex:1;}
  .noscroll::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>

<div id="menubar">
  <span class="appname">Cyberville Excel</span>
  <button id="btnNew" title="New workbook (clears current)">New</button>
  <button id="btnOpen" title="Open .xlsx / .xls / .xlsm / .csv (Ctrl+O)">Open</button>
  <button id="btnSave" class="primary" title="Save as .xlsx (Ctrl+S)">Save</button>
  <input id="fileName" type="text" value="spreadsheet.xlsx" spellcheck="false" title="Excel file name to save" style="width:168px">
  <button id="btnCSV" title="Export active sheet as .csv">CSV</button>
  <button id="btnPrint" title="Print active sheet">Print</button>
  <span class="sep"></span>
  <button id="btnUndo" title="Undo (Ctrl+Z)">Undo</button>
  <button id="btnRedo" title="Redo (Ctrl+Y)">Redo</button>
  <button id="btnInstall" title="Install this app for offline use" style="display:none;color:#fff;background:var(--accent);border-color:var(--accent);">Install</button>
  <span id="savedState"></span>
</div>

<div id="fmtbar">
  <button id="btnBold" title="Bold (Ctrl+B)"><b>B</b></button>
  <button id="btnItalic" title="Italic"><i>I</i></button>
  <button id="btnUnderline" title="Underline"><u>U</u></button>
  <span class="sep"></span>
  <span class="lbl">Text</span>
  <input type="color" id="fontColor" value="#000000" title="Text colour">
  <span class="lbl">Fill</span>
  <input type="color" id="fillColor" value="#ffffff" title="Fill colour">
  <span class="sep"></span>
  <button id="btnLeft" title="Align left">&#8676;</button>
  <button id="btnCenter" title="Align centre">&#8646;</button>
  <button id="btnRight" title="Align right">&#8677;</button>
  <span class="sep"></span>
  <select id="numFmt" title="Number format">
    <option value="">General</option>
    <option value="number">Number</option>
    <option value="int">Whole number</option>
    <option value="percent">Percent</option>
    <option value="currency">Currency</option>
    <option value="date">Date</option>
  </select>
  <span class="sep"></span>
  <button id="btnClearFmt" title="Remove formatting from selection">Clear format</button>
</div>

<div id="fxbar">
  <span id="cellRef">A1</span>
  <span style="color:#818b98">fx</span>
  <input type="text" id="fxInput" spellcheck="false" placeholder="Value or formula, e.g. =SUM(A1:A5)">
</div>

<div id="restoreBanner">
  <span>A saved copy from your last session was found.</span>
  <span class="spacer"></span>
  <button id="btnRestore">Restore</button>
  <button id="btnDiscard">Start fresh</button>
</div>

<div id="sheetWrap">
  <div id="corner" title="Select all"></div>
  <div id="colHead"></div>
  <div id="rowHead"></div>
  <div id="scroller">
    <div id="viewport"><div id="canvas"></div></div>
    <div id="frzCorner"></div>
    <div id="frzTop"></div>
    <div id="frzLeft"></div>
    <div id="colHeadFrozen"></div>
    <div id="rowHeadFrozen"></div>
  </div>
</div>

<div id="tabsbar">
  <div id="tabs"></div>
  <button id="addTab" title="Add sheet">+</button>
</div>

<div id="statusbar">
  <span id="stCell">-</span>
  <span id="stSize">-</span>
  <button id="btnMoreRows" title="Add 100 more rows to this sheet">+100 rows</button>
  <span class="right">Works offline &middot; data saved automatically</span>
</div>

<input type="file" id="openFile" accept=".xlsx,.xls,.xlsm,.csv">
<div id="toast"></div>

<script src="lib/xlsx.full.min.js"></script>
<script src="lib/ooxml.js"></script>
<script id="app-script">
'use strict';
/* ====================================================================
   Offline Spreadsheet — self-contained Excel-compatible editor
   - works fully offline (no network needed after first download)
   - reads/writes real Excel .xlsx / .xls / .xlsm and CSV
   - formulas, formatting, multiple sheets, autosave
   ==================================================================== */

var LS_KEY='offlineExcel.v1';
var APP_VERSION='2026-09-17';
var COL_LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
var ROWH=24, DEFW=100;
var DEFAULT_ROWS=300, DEFAULT_COLS=52, MAX_ROWS=10000;
var BUFFER=2;
var MAX_UNDO=80;
var COLW_DEFAULT=function(){var a=[];for(var i=0;i<DEFAULT_COLS;i++)a.push(DEFW);return a;};

/* ---------- tiny utils ---------- */
function colName(i){var s='';i=i+1;while(i>0){var m=(i-1)%26;s=COL_LETTERS[m]+s;i=((i-1)/26)|0;}return s;}
function colIdx(name){name=name.toUpperCase();var n=0;for(var k=0;k<name.length;k++)n=n*26+(name.charCodeAt(k)-64);return n-1;}
function key(r,c){return r+':'+c;}
function errVal(msg){return {__e:msg};}
function isErr(x){return x&&typeof x==='object'&&!!x.__e;}
function trunc(n){return n<0?Math.ceil(n):Math.floor(n);}
function debounce(fn,ms){var t;return function(){var a=arguments;clearTimeout(t);t=setTimeout(function(){fn.apply(null,a);},ms);};}

/* ====================================================================
   WORKBOOK STATE
   ==================================================================== */
var sheets={}, order=[], active=null;
var anchor={r:0,c:0}, cursor={r:0,c:0};
var editing=false;
var undostack=[], redostack=[];
var GEN=0;                       /* generation counter for formula cache */
var cellCache={}, inProgress={}; /* formula result cache + cycle guard */
var copyData=null;               /* internal clipboard 2D array ({f,v}) */

var ui={};
function $(id){return document.getElementById(id);}

function makeSheet(name){return {name:name, cells:{}, colW:COLW_DEFAULT(), rowH:Array(DEFAULT_ROWS).fill(ROWH), nr:DEFAULT_ROWS, frzRows:0, frzCols:0, dirty:{}, cleared:{}, merges:[], mergeMap:{}, oo:null};}
function addSheet(name,activate){
  if(!name){var n=1;do{name='Sheet'+n;n++;}while(sheets[name]);}
  var s=makeSheet(name);sheets[name]=s;order.push(name);
  if(activate){active=name;anchor={r:0,c:0};cursor={r:0,c:0};}
  return name;
}
function newWorkbook(){sheets={};order=[];undostack=[];redostack=[];OO=null;STY=null;addSheet('Sheet1',true);if(ui.fileName)ui.fileName.value='spreadsheet.xlsx';}

/* ---- fidelity state ---- */
var OO=null;      /* original xlsx: {bytes,entries,wbXml,relsXml,ctXml,stylesXml} */
var STY=null;     /* style registry for newly-authored cells */
function markDirty(r,c){var s=sheets[active];if(s&&s.oo){s.dirty[key(r,c)]=1;delete s.cleared[key(r,c)];}}
function markCleared(r,c){var s=sheets[active];if(s&&s.oo){s.cleared[key(r,c)]=1;delete s.dirty[key(r,c)];}}
function buildMergeMap(s){
  var mm={};
  if(s.merges){(s.merges||[]).forEach(function(m){for(var r=m.s.r;r<=m.e.r;r++)for(var c=m.s.c;c<=m.e.c;c++)mm[r+':'+c]={r:m.s.r,c:m.s.c};});}
  s.mergeMap=mm;
}
function realCell(s,r,c){var a=s.mergeMap[r+':'+c];return a?{r:a.r,c:a.c}:{r:r,c:c};}

function getCell(r,c){var s=sheets[active];return s.cells[key(r,c)]||null;}
function getOrMakeCell(r,c){var s=sheets[active];var k=key(r,c);if(!s.cells[k])s.cells[k]={};return s.cells[k];}
function getCellIn(sh,r,c){var s=sheets[sh];if(!s)return null;return s.cells[key(r,c)]||null;}
function sheetNamed(sh){return sheets[sh]||null;}

/* selection */
function selRect(){return {r0:Math.min(anchor.r,cursor.r),c0:Math.min(anchor.c,cursor.c),r1:Math.max(anchor.r,cursor.r),c1:Math.max(anchor.c,cursor.c)};}
function selSingle(){var r=selRect();return r.r0===r.r1&&r.c0===r.c1;}

/* formatting getter for toolbar state */
function fmtState(){
  var u={};
  if(selSingle()){
    var c=getCell(anchor.r,anchor.c);
    if(c)['b','i','u','color','fill','align','numfmt'].forEach(function(k){if(c[k]!=null)u[k]=c[k];});
    return u;
  }
  var r=selRect();
  for(var row=r.r0;row<=r.r1;row++)for(var cc=r.c0;cc<=r.c1;cc++){
    var c2=getCell(row,cc);
    if(c2)['b','i','u','color','fill','align','numfmt'].forEach(function(k){if(c2[k]!=null)u[k]=c2[k];});
  }
  return u;
}

/* ====================================================================
   STORAGE
   ==================================================================== */
function serialize(){
  var wb={order:order.concat(),active:active};
  wb.sheets={};
  order.forEach(function(n){var s=sheets[n];wb.sheets[n]={cells:s.cells,colW:s.colW.slice(),nr:s.nr,merges:s.merges||[]};});
  return wb;
}
function restoreFromData(wb){
  sheets={};order=wb.order.concat();active=wb.active;
  if(!order.length){order=['Sheet1'];}
  order.forEach(function(n){
    var o=wb.sheets[n]||{};
    var s={name:n,cells:o.cells||{},colW:(o.colW&&o.colW.length)?o.colW.slice():COLW_DEFAULT(),nr:o.nr||DEFAULT_ROWS,dirty:{},cleared:{},merges:o.merges||[],mergeMap:{},oo:null};
    buildMergeMap(s);sheets[n]=s;
  });
  OO=null;STY=null;
  if(!sheets[active])active=order[0];
  if(!anchor)anchor={r:0,c:0};
  cursor={r:anchor.r,c:anchor.c};
}
function saveSessionNow(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(serialize()));}
  catch(e){}
  ui.saved.textContent='Saved ';ui.saved.innerHTML='Saved &nbsp;&middot; '+new Date().toLocaleTimeString();
}
var saveSessionSoon=debounce(saveSessionNow,600);
function loadSession(){try{var raw=localStorage.getItem(LS_KEY);return raw?JSON.parse(raw):null;}catch(e){return null;}}

/* ====================================================================
   FORMULA ENGINE
   - value types: number | string | boolean | Date | null | errVal
   - functions receive materialized args; ranges are {__range,vals:2D}
   ==================================================================== */
function applyNumFmt(v,fmt){
  if(typeof v!=='number'||!isFinite(v))return v;
  switch(fmt){
    case 'int':return String(Math.trunc(v));
    case 'number':return Number(v).toLocaleString('en-US',{maximumFractionDigits:10});
    case 'percent':return (v*100)+'%';
    case 'currency':return '$'+Number(v.toFixed(2)).toLocaleString('en-US',{minimumFractionDigits:2});
    case 'date':return new Date(v).toLocaleDateString();
    default:return String(v);
  }
}
function displayText(r,c){
  var cell=getCell(r,c);
  if(!cell)return {txt:'',cls:'',raw:''};
  var raw=cell.f?('='+cell.f):(cell.v==null?'':plainString(cell.v));
  var v;
  if(cell.f){
    v=resolve(active,r,c);
  } else v=cell.v;
  var txt='',cls='';
  if(v===null||v===undefined)txt='';
  else if(isErr(v)){txt=v.__e;cls='err';}
  else if(v instanceof Date)txt=v.toLocaleDateString();
  else if(typeof v==='boolean')txt=v?'TRUE':'FALSE';
  else if(typeof v==='number'){txt=String(applyNumFmt(v,cell.numfmt));cls='num';if(cell.f)cls+=' fml';}
  else{txt=String(v);if(cell.f)cls+=' fml';}
  if(cell.f)return {txt:txt,cls:cls,raw:raw};
  return {txt:txt,cls:cls,raw:raw};
}
function plainString(v){
  if(typeof v==='boolean')return v?'TRUE':'FALSE';
  if(v instanceof Date)return v.toLocaleDateString();
  return v==null?'':String(v);
}

/* resolve a cell to a value (evaluating formulas with caching & cycle guard) */
function resolve(sh,r,c){
  var s=sheets[sh];
  if(!s)return errVal('#REF!');
  var cell=s.cells[key(r,c)];
  if(!cell)return null;
  if(cell.f){
    var id=sh+'|'+r+':'+c;
    if(inProgress[id])return errVal('#CYCLE!');
    if(cellCache[id]&&cellCache[id].generation===GEN)return cellCache[id].v;
    inProgress[id]=true;
    var v;
    try{ v=evalFormula(cell.f,sh); }
    catch(e){ v=errVal(errName(e)); }
    delete inProgress[id];
    cellCache[id]={generation:GEN,v:v};
    return v;
  }
  return cell.v;
}
function bustCache(){GEN++;}

function errName(e){return (e&&e.excelErr)?e.excelErr:'#VALUE!';}

function num(v){if(isErr(v))return v;if(v==null)return 0;if(typeof v==='boolean')return v?1:0;if(typeof v==='number'&&isFinite(v))return v;return errVal('#VALUE!');}
function str(v){if(isErr(v))return v;if(v==null)return '';if(v instanceof Date)return v.toLocaleDateString();return String(v);}
function truthy(v){if(isErr(v))return v;if(typeof v==='boolean')return v;var n=num(v);if(isErr(n))return v;return n!==0;}

function tokenize(f){
  var toks=[],i=0,n=f.length;
  while(i<n){
    var ch=f[i];
    if(/\s/.test(ch)){i++;continue;}
    if('+-*/^()%,;:'.indexOf(ch)>=0){toks.push({t:'op',v:ch});i++;continue;}
    if(ch==='<'||ch==='>'||ch==='='||ch==='&'||ch==='!'){toks.push({t:'op',v:ch});i++;continue;}
    if(/[0-9]/.test(ch)||(ch==='.'&&/[0-9]/.test(f[i+1]||''))){
      var m=f.slice(i).match(/^\d*\.?\d+(?:[eE][+-]?\d+)?/);
      toks.push({t:'num',v:parseFloat(m[0])});i+=m[0].length;continue;
    }
    if(ch==='"'){
      var j=i+1,s='';
      while(j<n){if(f[j]==='"'){if(f[j+1]==='"'){s+='"';j+=2;}else{j++;break;}}else s+=f[j++];}
      toks.push({t:'str',v:s});i=j;continue;
    }
    if(/[A-Za-z_]/.test(ch)){
      var mw=f.slice(i).match(/^[A-Za-z_][A-Za-z0-9_.]*/);
      toks.push({t:'word',v:mw[0]});i+=mw[0].length;continue;
    }
    throw {excelErr:'#VALUE!'};
  }
  toks.push({t:'eof',v:''});
  return toks;
}

function evalFormula(f,shName){
  var toks=tokenize(f);
  var p=new Parser(toks,shName);
  var res=p.parseCompare();
  if(!p.eof())throw {excelErr:'#VALUE!'};
  return res;
}

function Parser(toks,shName){
  var self=this,i=0;
  function peek(){return toks[i].v;}
  function nxt(){return toks[i++].v;}
  function eof(){return i>=toks.length-1;}
  self.eof=eof;
  self.parseCompare=parseCompare;

  function parseCompare(){
    var left=parseAdd();
    while(['=','<>','<','<=','>','>='].indexOf(peek())>=0){
      var op=nxt();
      if(op==='<'&&(peek()==='='||peek()==='>'))op+=nxt();
      else if(op==='>'&&peek()==='=')op+=nxt();
      var right=parseAdd();
      left=compareOp(left,right,op);
    }
    return left;
  }
  function parseAdd(){
    var left=parseMul();
    while(peek()==='+'||peek()==='-'||peek()==='&'){
      var op=nxt(),right=parseMul();
      if(op==='&'){
        if(isErr(left))return left;if(isErr(right))return right;
        left=str(left)+str(right);
      }else left=arith(left,right,op);
    }
    return left;
  }
  function parseMul(){
    var left=parseUnary();

/* ====================================================================
   DATA EDITING
   ==================================================================== */
function snap(){
  undostack.push(JSON.stringify(serialize()));
  if(undostack.length>MAX_UNDO)undostack.shift();
  redostack=[];
}
function oldCell(c, v){return c&&c.f?{f:c.f}:{v:v};}
function setCellValue(r,c,raw){
  /* returns the parsed cell object */
  var cell=getOrMakeCell(r,c);
  var existing=cell;
  var val=parseRaw(raw);
  if(val===undefined){ /* empty: clear the cell value only if no f/v */
    if(cell.f)delete cell.f;
    else delete cell.v;
    if(!cell.f&&cell.v==null&&!hasFmt(cell)){delete sheets[active].cells[key(r,c)];markCleared(r,c);}
    return null;
  }
  if(typeof val==='string'&&val.charAt(0)==='='){
    var f=val.slice(1);
    if(f==='')return null;
    cell.f=f;
    if('v' in cell)delete cell.v;
    markDirty(r,c);
  }else{
    var prevFmt={};
    ['b','i','u','color','fill','align','numfmt'].forEach(function(k){if(cell[k]!=null)prevFmt[k]=cell[k];});
    delete sheets[active].cells[key(r,c)];
    cell=getOrMakeCell(r,c);
    Object.keys(prevFmt).forEach(function(k){cell[k]=prevFmt[k];});
    cell.v=val;
    if(cell.f)delete cell.f;
    if(val!==null&&val!==undefined&&val!=='')markDirty(r,c);else markCleared(r,c);
  }
  return cell;
}
function hasFmt(c){return ['b','i','u','color','fill','align','numfmt'].some(function(k){return c[k]!=null;});}
function parseRaw(raw){
  if(raw==null)return undefined;
  raw=removeZwj(String(raw));
  if(raw.trim()==='')return undefined;
  var t=raw.trim();
  if(t.match(/^[-+]?\d*\.?\d+(?:[eE][+-]?\d+)?$/))return parseFloat(t);
  if(t.match(/^[-+]?\d*\.?\d+%$/))return {__percent:parseFloat(t)/100};
  if(t.toUpperCase()==='TRUE')return true;
  if(t.toUpperCase()==='FALSE')return false;
  return t;
}
function removeZwj(s){return s.replace(/[\u200B\uFEFF]/g,'');}
function commitCell(r,c,raw){
  var cell=setCellValue(r,c,raw);
  if(cell&&cell.v&&typeof cell.v==='object'&&cell.v.__percent){
    cell.v=cell.v.__percent;
    cell.numfmt='percent';
    delete cell.v.__percent;
  }
  afterEdit();
}
function afterEdit(){
  bustCache();
  renderGrid();
  updateFx();updateStatus();syncFmtUI();
  saveSessionSoon();
}
function deleteSelection(){
  var r=selRect();snap();
  for(var i=r.r0;i<=r.r1;i++)for(var j=r.c0;j<=r.c1;j++){
    var cell=getCell(i,j);
    if(cell){delete sheets[active].cells[key(i,j)];markCleared(i,j);}
  }
  afterEdit();
}

/* ====================================================================
   UNDO / REDO
   ==================================================================== */
function undo(){
  if(!undostack.length){toast('Nothing to undo');return;}
  redostack.push(JSON.stringify(serialize()));
  var state=JSON.parse(undostack.pop());
  restoreFromData(state);
  if(anchor){cursor={r:anchor.r,c:anchor.c};}
  afterEdit();
  toast('Undone');
}
function redo(){
  if(!redostack.length){toast('Nothing to redo');return;}
  undostack.push(JSON.stringify(serialize()));
  var state=JSON.parse(redostack.pop());
  restoreFromData(state);
  if(anchor){cursor={r:anchor.r,c:anchor.c};}
  afterEdit();
  toast('Redone');
}

/* ====================================================================
   RENDERING (virtual grid)
   ==================================================================== */
var colOffsets=[],totalW=0,totalH=0;

function buildLayout(){
  var s=sheets[active];
  colOffsets=[];totalW=0;
  for(var i=0;i<s.colW.length;i++){colOffsets.push(totalW);totalW+=s.colW[i];}
  totalH=s.nr*ROWH;
}

  ui.frzLeft.style.display=fc?'block':'none';
  ui.colHeadFrozen.style.display=fc?'block':'none';
  ui.rowHeadFrozen.style.display=fr?'block':'none';
  if(!fr&&!fc)return;
  var k;
  for(k in ui.frzTop.children)if(ui.frzTop.children.hasOwnProperty(k)){
    var ch=ui.frzTop.children[k];
    if(ch&&ch.parentNode)ch.parentNode.removeChild(ch);
  }
  for(k in ui.frzLeft.children)if(ui.frzLeft.children.hasOwnProperty(k)){
    var cl=ui.frzLeft.children[k];
    if(cl&&cl.parentNode)cl.parentNode.removeChild(cl);
  }

    var el=document.createElement('div');el.className='cell';
    el.style.width=width+'px';el.style.height=height+'px';
    el.style.left=left+'px';el.style.top=top+'px';
    el.textContent=txt==null?'':(''+txt);
    target.appendChild(el);
  }
  var frR=Math.min(fr,s.nr),fcC=Math.min(fc,s.colW.length);
  for(var r=0;r<frR;r++){
    var y=r*ROWH,rowCell=s.cells[r+':'+0];
    var txt='';
    for(var c=0;c<s.colW.length;c++){
      var key=r+':'+c,cell=s.cells[key];
      if(!cell)break;
      if(cell&&cell.v!=null)txt+=(c>0?' ':'')+cell.v;
    }
    addCell(ui.frzTop,r,c,s.colW.length?(''+s.colW[0]):0,ROWH,0,y,txt);
  }
  for(var c2=0;c2<fcC;c2++){
    var x2=colOffsets[c2]||0;
    for(var r2=0;r2<s.nr;r2++){
      var key2=r2+':'+c2,cell2=s.cells[key2];
      if(!cell2)continue;
      addCell(ui.frzLeft,r2,c2,s.colW[c2]||COLW_DEFAULT(),ROWH,x2,r2*ROWH,cell2.v==null?'':(''+cell2.v));
    }
  }
}

function renderGrid(){
  var s=sheets[active];
  var cvs=ui.canvas;
  cvs.innerHTML='';
  cvs.style.width=totalW+'px';
  cvs.style.height=totalH+'px';
  var scr=ui.viewport||ui.scroller;
  var firstRow=Math.max(0,Math.floor(scr.scrollTop/ROWH)-BUFFER);
  var lastRow=Math.min(s.nr-1,Math.ceil((scr.scrollTop+scr.clientHeight)/ROWH)+BUFFER);
  var firstCol=0,lastCol=s.colW.length-1;
  /* visible columns */
  var scL=scr.scrollLeft,scW=scr.clientWidth;
  for(var i=0;i<s.colW.length;i++){
    if(colOffsets[i]+s.colW[i]>scL){firstCol=i;break;}
  }
  for(var j=s.colW.length-1;j>=0;j--){
    if(colOffsets[j]<scL+scW){lastCol=j;break;}
  }
  firstCol=Math.max(0,firstCol-1);
  lastCol=Math.min(s.colW.length-1,lastCol+1);
  var frag=document.createDocumentFragment();
  var mm=s.mergeMap||{};
  for(var r=firstRow;r<=lastRow;r++){
    for(var c=firstCol;c<=lastCol;c++){
      var ma=mm[r+':'+c];
      if(ma&&(ma.r!==r||ma.c!==c))continue; /* covered by merged anchor */
      var d=document.createElement('div');
      d.className='cell';
      var dv=displayText(r,c);
      d.textContent=dv.txt;
      d.title=colName(c)+(r+1)+': '+dv.raw;
      if(dv.cls)d.className='cell '+dv.cls;
      d.style.left=colOffsets[c]+'px';
      d.style.top=(r*ROWH)+'px';
      d.style.width=s.colW[c]+'px';
      d.style.height=ROWH+'px';
      if(ma){
        var span=null;
        if(s.merges){for(var mi=0;mi<s.merges.length;mi++){var m=s.merges[mi];if(m.s.r===r&&m.s.c===c){span=m;break;}}}
        if(span){
          d.style.width=(colOffsets[span.e.c]+s.colW[span.e.c]-colOffsets[c])+'px';
          d.style.height=((span.e.r-span.s.r+1)*ROWH)+'px';
        }
      }
      var stl=cellStyle(r,c);
      if(stl)d.style.cssText+=';'+stl;
      d.setAttribute('data-r',r);
      d.setAttribute('data-c',c);
      frag.appendChild(d);
    }
  }
  cvs.appendChild(frag);
  /* selection overlays */
  drawSelection();
}
function cellStyle(r,c){
  var cell=getCell(r,c);
  if(!cell)return'';
  var s=[];
  if(cell.b)s.push('font-weight:bold');
  if(cell.i)s.push('font-style:italic');
  if(cell.u)s.push('text-decoration:underline');
  if(cell.color)s.push('color:'+cell.color);
  if(cell.fill&&cell.fill.toLowerCase()!=='#ffffff')s.push('background-color:'+cell.fill);
  if(cell.align)s.push('text-align:'+cell.align);
  return s.join(';');
}
function drawSelection(){
  var s=sheets[active];
  var sel=selRect();
  var x=colOffsets[sel.c0],y=sel.r0*ROWH;
  var w=colOffsets[sel.c1]+s.colW[sel.c1]-x;

  if(!fill){
    fill=document.createElement('div');fill.id='selFill';

  }
  fill.style.left=x+'px';fill.style.top=y+'px';fill.style.width=w+'px';fill.style.height=h+'px';
  box.style.left=x+'px';box.style.top=y+'px';box.style.width=w+'px';box.style.height=h+'px';
  /* highlight headers */
  var cHeadSel=(ui.colHeadInner||ui.colHead).querySelectorAll('.hl'),rHeadSel=(ui.rowHeadInner||ui.rowHead).querySelectorAll('.hl');
  cHeadSel.forEach(function(n){n.classList.remove('hl');});
  rHeadSel.forEach(function(n){n.classList.remove('hl');});
  (ui.colHeadInner||ui.colHead).querySelectorAll('[data-c]').forEach(function(n){
    var ci=parseInt(n.dataset.c,10);
    if(ci>=sel.c0&&ci<=sel.c1)n.classList.add('hl');
  });
  (ui.rowHeadInner||ui.rowHead).querySelectorAll('[data-r]').forEach(function(n){
    var ri=parseInt(n.dataset.r,10);

  });
}
function syncScroll(){

function cellFromEvent(e){
  var s=sheets[active];
  var rect=ui.scroller.getBoundingClientRect();
  var x=e.clientX-rect.left+ui.scroller.scrollLeft;
  var y=e.clientY-rect.top+ui.scroller.scrollTop;
  var c=0;
  for(var i=0;i<s.colW.length;i++){
    if(x<colOffsets[i]){c=Math.max(0,i-1);break;}
    if(x>=colOffsets[i]&&x<colOffsets[i]+s.colW[i]){c=i;break;}
    if(i===s.colW.length-1)c=i;
  }
  var r=Math.floor(y/ROWH);
  r=Math.max(0,r);r=Math.min(s.nr-1,r);
  var rc=realCell(s,r,c);
  return {r:rc.r,c:rc.c};
}
function selectCell(r,c,e,extend){
  var s=sheets[active];
  r=Math.max(0,Math.min(s.nr-1,r));
  c=Math.max(0,Math.min(s.colW.length-1,c));
  var rc=realCell(s,r,c);r=rc.r;c=rc.c;
  if(e&&e.shiftKey){cursor.r=r;cursor.c=c;}
  else{anchor.r=r;anchor.c=c;cursor.r=r;cursor.c=c;}
  updateFx();updateStatus();drawSelection();
  scrollCellIntoView(anchor.r,anchor.c);
}
function selectColumn(c,e){var s=sheets[active];anchor={r:0,c:c};cursor={r:s.nr-1,c:c};updateFx();updateStatus();drawSelection();}
function selectRow(r,e){var s=sheets[active];anchor={r:r,c:0};cursor={r:r,c:s.colW.length-1};updateFx();updateStatus();drawSelection();}
function selectAllGrid(){var s=sheets[active];anchor={r:0,c:0};cursor={r:s.nr-1,c:s.colW.length-1};updateFx();updateStatus();drawSelection();}
function scrollCellIntoView(r,c){
  var s=sheets[active];
  var x=colOffsets[c],y=r*ROWH;
  var sc=ui.scroller;
  if(x<sc.scrollLeft)sc.scrollLeft=x;
  else if(x+s.colW[c]>sc.scrollLeft+sc.clientWidth)sc.scrollLeft=x+s.colW[c]-sc.clientWidth;
  if(y<sc.scrollTop)sc.scrollTop=y;
  else if(y+ROWH>sc.scrollTop+sc.clientHeight)sc.scrollTop=y+ROWH-sc.clientHeight;
}

/* editing */
function startEdit(r,c,prefill){
  if(editing)commitEdit();
  editing=true;
  var s=sheets[active];
  var cell=getCell(r,c);
  var txt=prefill!==undefined?prefill:(cell?(cell.f?'='+cell.f:plainString(cell.v)):'');
  var ed=document.createElement('textarea');
  ed.id='editor';
  ed.style.left=colOffsets[c]+'px';
  ed.style.top=(r*ROWH)+'px';
  ed.style.width=(s.colW[c]-2)+'px';
  ed.style.height=(ROWH-2)+'px';
  ed.value=txt;
  ed.spellcheck=false;
  ed.wrap='off';
  ui.canvas.appendChild(ed);
  ed.focus();
  ed.select();
  ui.editor=ed;
  ed.addEventListener('blur',function(){if(editing)commitEdit();});
  ed.addEventListener('keydown',function(ev){
    ev.stopPropagation();
    if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();commitEdit();moveSel(1,0);return;}
    if(ev.key==='Tab'){ev.preventDefault();commitEdit();moveSel(0,ev.shiftKey?-1:1);return;}
    if(ev.key==='Escape'){ev.preventDefault();cancelEdit();}
  });
}
function commitEdit(){
  if(!editing)return;
  var ed=ui.editor;if(!ed){editing=false;return;}
  var raw=ed.value;
  ui.canvas.removeChild(ed);
  ui.editor=null;
  editing=false;
  snap();
  commitCell(anchor.r,anchor.c,raw);
  drawSelection();
}
function cancelEdit(){
  if(!editing)return;
  if(ui.editor&&ui.editor.parentNode===ui.canvas)ui.canvas.removeChild(ui.editor);
  ui.editor=null;editing=false;
}
function moveSel(dr,dc){
  var s=sheets[active];
  anchor.r=Math.max(0,Math.min(s.nr-1,anchor.r+dr));

  cursor={r:anchor.r,c:anchor.c};
  selectCell(anchor.r,anchor.c,null,false);
}

/* ====================================================================
   COPY / PASTE
   ==================================================================== */
function copySelection(){
  if(!Array.prototype.flat)Array.prototype.flat=function(){return this.reduce(function(a,b){return a.concat(b);},[]);};
  var sel=selRect();
  var rows=[];
  copyData=[];
  for(var r=sel.r0;r<=sel.r1;r++){
    var cells=[];
    for(var c=sel.c0;c<=sel.c1;c++){
      var cell=getCell(r,c);
      copyData.push({r:r-sel.r0,c:c-sel.c0,f:cell?cell.f:null,v:cell?cell.v:null});
      cells.push(cell?(cell.f?'='+cell.f:plainString(cell.v)):'');
    }
    rows.push(cells.join('\t'));
  }
  var text=rows.join('\n');
  var ok=(navigator.clipboard&&navigator.clipboard.writeText)?true:false;
  if(ok){navigator.clipboard.writeText(text).catch(function(){});}
  toast('Copied '+((sel.r1-sel.r0+1)*(sel.c1-sel.c0+1))+' cell(s)');
}
function pasteFromText(text){
  var lines=text.replace(/\r/g,'').split('\n');
  var rows=lines.map(function(l){return l.split('\t');});
  snap();
  for(var r=0;r<rows.length;r++)for(var c=0;c<rows[r].length;c++){
    var rr=anchor.r+r,cc=anchor.c+c;
    if(rr>=sheets[active].nr||cc>=sheets[active].colW.length)continue;
    setCellValue(rr,cc,rows[r][c]);
  }
  afterEdit();
  toast('Pasted');
}
function pasteInternal(){
  snap();
  copyData.forEach(function(entry){
    var rr=anchor.r+entry.r,cc=anchor.c+entry.c;
    if(rr>=sheets[active].nr||cc>=sheets[active].colW.length)return;
    var cell=getOrMakeCell(rr,cc);
    if(entry.f){cell.f=entry.f;if('v'in cell)delete cell.v;markDirty(rr,cc);}
    else if(entry.v!==null&&entry.v!==undefined){cell.v=entry.v;if(cell.f)delete cell.f;markDirty(rr,cc);}
    else if(!hasFmt(cell)){delete sheets[active].cells[key(rr,cc)];markCleared(rr,cc);}
  });
  afterEdit();
  toast('Pasted');
}
function pasteSelection(){
  if(navigator.clipboard&&navigator.clipboard.readText){
    navigator.clipboard.readText().then(function(t){
      if(t&&t.indexOf('\t')>=0||t&&t.indexOf('\n')>=0)pasteFromText(t);
      else if(copyData)pasteInternal();
      else if(t)pasteFromText(t);
    }).catch(function(){if(copyData)pasteInternal();});
  }else if(copyData)pasteInternal();
}

function buildTabs(){
  var tabs=ui.tabs;tabs.innerHTML='';
  order.forEach(function(name){
    var t=document.createElement('div');
    t.className='tab'+(name===active?' active':'');
    var span=document.createElement('span');
    span.textContent=name;
    span.style.overflow='hidden';span.style.textOverflow='ellipsis';span.style.whiteSpace='nowrap';
    var x=document.createElement('span');
    x.className='x';x.textContent='\u00d7';x.title='Delete sheet';
    x.addEventListener('mousedown',function(e){e.stopPropagation();e.preventDefault();deleteSheet(name);});
    t.appendChild(span);t.appendChild(x);
    t.addEventListener('mousedown',function(e){e.stopPropagation();e.preventDefault();var nm=this.childNodes[0].textContent;switchTo(nm);});
    t.addEventListener('dblclick',function(e){e.stopPropagation();e.preventDefault();var nm=this.childNodes[0].textContent;renameSheet(nm);});
    tabs.appendChild(t);
  });
}
function switchTo(name){
  if(!sheets[name])return;
  if(editing)commitEdit();
  if(document.activeElement===ui.fxInput)ui.fxInput.blur();
  if(copyData)copyData=null;
  active=name;
  if(!sheets[name].colW)sheets[name].colW=COLW_DEFAULT();
  anchor={r:0,c:0};cursor={r:0,c:0};
  ui.scroller.scrollTop=0;ui.scroller.scrollLeft=0;
  buildTabs();renderAll();
}
function addSheetUI(){
  var name;
  var n=1;do{name='Sheet'+n;n++;}while(sheets[name]);
  addSheet(name,true);
  buildTabs();renderAll();
}
function renameSheet(name){
  var cur=sheets[name];if(!cur)return;
  var nn=prompt('Rename sheet to:',name);
  if(!nn)return;
  nn=nn.replace(/[\\\/\?\*\[\]:]/g,'').trim();
  if(!nn||nn===name)return;
  if(sheets[nn]){toast('Sheet name already exists');return;}
  delete sheets[name];
  sheets[nn]=cur;cur.name=nn;
  order=order.map(function(n){return n===name?nn:n;});
  var wasActive=active===name;
  if(wasActive)active=nn;
  buildTabs();renderAll();saveSessionNow();
}
function deleteSheet(name){
  if(order.length<=1){toast('Cannot delete the only sheet');return;}
  if(!confirm('Delete sheet "'+name+'"?'))return;
  var idx=order.indexOf(name);
  if(idx<0)return;
  order.splice(idx,1);
  delete sheets[name];
  if(active===name)active=order[Math.max(0,idx-1)];
  if(active===name||!sheets[active])active=order[0];
  buildTabs();renderAll();
}

/* ====================================================================
   IMPORT / EXPORT
   ==================================================================== */
function z2numfmt(z){
  if(!z)return'';
  if(z.indexOf('%')>=0)return'percent';
  if(z.indexOf('$')>=0||z.indexOf('[$')>=0)return'currency';
  if(z.indexOf('0')>=0&&z.indexOf('.')>=0)return'number';
  if(z==='0')return'int';
  if(/y|m|d/.test(z)&&z.indexOf('0')<0)return'date';
  return'';
}
function importFile(file){
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=new Uint8Array(reader.result);
      var wb=XLSX.read(data,{type:'array',cellDates:true,cellNF:true});
      refreshStateFromXLSX(wb,file.name,data);
    }catch(e){
      try{
        var text=reader.result;
        var ws=XLSX.read(text,{type:'string'});
        refreshStateFromXLSX(ws,file.name);
      }catch(e2){toast('Could not read that file: '+e2.message);try{console.error('import failed',e,e2);}catch(_){}}
    }
  };
  reader.readAsArrayBuffer(file);
}
function refreshStateFromXLSX(wb,fileName,rawBytes){
  sheets={};order=[];undostack=[];redostack=[];
  wb.SheetNames.forEach(function(nm){
    var ws=wb.Sheets[nm];
    var s={name:nm,cells:{},colW:COLW_DEFAULT(),nr:DEFAULT_ROWS,dirty:{},cleared:{},merges:ws['!merges']||[],mergeMap:{},oo:null};
    buildMergeMap(s);
    if(ws['!ref']){
      var rng=XLSX.utils.decode_range(ws['!ref']);
      s.nr=Math.max(rng.e.r+1,DEFAULT_ROWS);
    }
    var colClues=ws['!cols'];
    if(colClues&&colClues.length){
      for(var i=0;i<colClues.length&&i<100;i++){
        var ww=colClues[i].wch?Math.round(colClues[i].wch*7):(colClues[i].width?Math.round(colClues[i].width*8):DEFW);
        if(ww>=30&&ww<=400)s.colW[i]=ww;
      }
    }
    if(ws['!ref']){
      var range=XLSX.utils.decode_range(ws['!ref']);
      for(var R=range.s.r;R<=range.e.r;R++){
        for(var C=range.s.c;C<=range.e.c;C++){
          var addr=XLSX.utils.encode_cell({r:R,c:C});
          var cellv=ws[addr];
          if(!cellv)continue;
          var cobj={};
          if(cellv.f){cobj.f=cellv.f.charAt(0)==='='?cellv.f.slice(1):cellv.f;}
          else{
            var val;
            if(cellv.t==='n')val=cellv.v;
            else if(cellv.t==='b')val=cellv.v;
            else if(cellv.t==='d')val=cellv.v;
            else if(cellv.v!=null)val=cellv.v;
            else if(cellv.w!=null)val=cellv.w;
            else val='';
            if(val===null||val===undefined)continue;
            cobj.v=val;
            var nz=z2numfmt(cellv.z);
            if(nz)cobj.numfmt=nz;
          }
          /* move formatting from generic row:font + alignment */
          if(cellv.s!=null){ /* style index; SheetJS CE doesn't give styles array, skip */
          }
          s.cells[key(R,C)]=cobj;
        }
      }
    }
    sheets[nm]=s;order.push(nm);
  });
  if(!order.length){addSheet('Sheet1');order=['Sheet1'];}
  active=order[0];
  anchor={r:0,c:0};cursor={r:0,c:0};
  ui.scroller.scrollTop=0;ui.scroller.scrollLeft=0;
  if(rawBytes){if(!captureOoxml(rawBytes))toast('Warning: full fidelity unavailable for this file');}
  if(ui.fileName&&fileName)ui.fileName.value=fileName;
  buildTabs();renderAll();
  bustCache();
  saveSessionNow();
  toast('Opened '+fileName+' ('+order.length+' sheet(s))');
}
function captureOoxml(bytes){
  try{
    var entries=XLSXF.zipParse(bytes);
    var wbE=XLSXF.findEntry(entries,'xl/workbook.xml');
    if(!wbE)return false;
    var oo={bytes:bytes,entries:entries};
    oo.wbXml=XLSXF.entryText(bytes,wbE);
    var relE=XLSXF.findEntry(entries,'xl/_rels/workbook.xml.rels');
    oo.relsXml=relE?XLSXF.entryText(bytes,relE):'';
    var ctE=XLSXF.findEntry(entries,'[Content_Types].xml');
    oo.ctXml=ctE?XLSXF.entryText(bytes,ctE):null;
    var stE=XLSXF.findEntry(entries,'xl/styles.xml');
    oo.stylesXml=stE?XLSXF.entryText(bytes,stE):null;
    var wbSheets=XLSXF.parseWorkbookSheets(oo.wbXml);
    var ridTarget=XLSXF.parseRels(oo.relsXml);
    (wbSheets||[]).forEach(function(sh){
      var target=ridTarget?ridTarget[sh.rid]:null;
      var path=target?XLSXF.resolveTarget(target):null;
      var s=sheets[sh.name];
      if(!s||!path)return;
      var e=XLSXF.findEntry(entries,path);
      if(!e)return;
      var xml=XLSXF.entryText(bytes,e);
      var parts=XLSXF.sheetParts(xml);
      if(parts===null)return;
      var rows=XLSXF.parseRows(parts.body);
      s.oo={path:path,head:parts.head,tail:parts.tail,rows:rows,rid:sh.rid,sheetId:sh.sheetId||0};
      s.dirty={};s.cleared={};
    });
    OO=oo;STY=null;
    return true;
  }catch(e){try{console.error(e);}catch(_){}return false;}
}
function exportXLSX(){
  try{
    var fname=(ui.fileName&&ui.fileName.value.trim())||'spreadsheet.xlsx';

    var out=OO?buildSurgicalXLSX():buildFreshXLSX();

function TE2(s){return new TextEncoder().encode(s);}
function deliverFile(u8,fname){

    window.showSaveFilePicker({suggestedName:fname,types:[{description:'Excel Workbook',accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx','.xlsm']}}]}).then(function(handle){
      handle.createWritable().then(function(w){return w.write(blob).then(function(){return w.close();});}).then(function(){toast('Saved '+handle.name);}).catch(function(err){if(!err||err.name==='AbortError')return;downloadBlob(blob,fname);});
    }).catch(function(err){if(err&&err.name==='AbortError')return;downloadBlob(blob,fname);});
  }else downloadBlob(blob,fname);
}
function downloadBlob(blob,fname){

function ensureStyleReg(){
  if(STY)return STY;
  var base=(OO&&OO.stylesXml)?XLSXF.stylesBase(OO.stylesXml):{nums:0,fonts:1,fills:2,xfs:1,nextNumId:164};
  STY={nextN:base.nextNumId,nextF:base.fonts,nextFill:base.fills,nextX:base.xfs,nums:{},fonts:{},fills:{},xfs:{},order:[]};
  return STY;
}
function rectStyleId(cell){
  ensureStyleReg();
  if(!cell)return 0;
  if(!hasFmt(cell))return -1;
  var reg=STY;
  var fontKey=((cell.b?'B':'')+(cell.i?'I':'')+(cell.u?'U':'')+':'+(cell.color||''));
  var fillKey=(cell.fill&&cell.fill.toLowerCase()!=='#ffffff')?('FF'+(cell.fill.replace('#','').toUpperCase())):'';
  var numKey=cell.numfmt?numfmtToZ(cell.numfmt)||'':'';
  var key=fontKey+'|'+fillKey+'|'+(cell.align||'')+'|'+numKey;
  if(reg.xfs[key]!=null)return reg.xfs[key];
  var numFmtId=0;
  if(numKey){if(reg.nums[numKey]==null){reg.nums[numKey]=reg.nextN++;}numFmtId=reg.nums[numKey];}
  var fontId=0;
  if(fontKey){if(reg.fonts[fontKey]==null){reg.fonts[fontKey]=reg.nextF++;}fontId=reg.fonts[fontKey];}
  var fillId=0;
  if(fillKey){if(reg.fills[fillKey]==null){reg.fills[fillKey]=reg.nextFill++;}fillId=reg.fills[fillKey];}
  var xf=reg.nextX++;
  reg.xfs[key]=xf;
  reg.order.push({numFmtId:numFmtId,fontId:fontId,fillId:fillId});
  return xf;
}
function authoredStyleId(cell,origMarkup){
  var has=cell?hasFmt(cell):false;
  if(has){var id=rectStyleId(cell);return id>=0?id:0;}
  if(origMarkup){var m=/s="(\d+)"/.exec(origMarkup);if(m)return +m[1];}
  return 0;
}
function excelSerial(d){
  var epoch=Date.UTC(1899,11,30);
  return (Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours(),d.getMinutes(),d.getSeconds(),d.getMilliseconds())-epoch)/86400000;
}
function authoredCellXml(r,c,cell,origMarkup,sheetName){
  var addr=XLSX.utils.encode_cell({r:r,c:c});
  var s=authoredStyleId(cell,origMarkup);
  var sAtt=s>0?' s="'+s+'"':'';
  if(cell&&cell.f){
    var v=resolve(sheetName,r,c);
    var inner;
    if(isErr(v))inner='<f>'+XLSXF.escText(cell.f)+'</f><v>'+XLSXF.escText(v.__e)+'</v>';
    else{
      var vx=(v==null)?'':(v instanceof Date?excelSerial(v):(typeof v==='boolean'?(v?1:0):v));
      inner='<f>'+XLSXF.escText(cell.f)+'</f><v>'+vx+'</v>';
    }
    var tErr=isErr(v)?' t="e"':(typeof v==='boolean'?' t="b"':'');
    return '<c r="'+addr+'"'+sAtt+tErr+'>'+inner+'</c>';
  }
  if(!cell||cell.v==null)return '<c r="'+addr+'"'+sAtt+'/>';
  var val=cell.v;
  if(typeof val==='number')return '<c r="'+addr+'"'+sAtt+'><v>'+val+'</v></c>';
  if(typeof val==='boolean')return '<c r="'+addr+'"'+sAtt+' t="b"><v>'+(val?1:0)+'</v></c>';
  if(val instanceof Date)return '<c r="'+addr+'"'+sAtt+'><v>'+excelSerial(val)+'</v></c>';
  return '<c r="'+addr+'"'+sAtt+' t="inlineStr"><is><t xml:space="preserve">'+XLSXF.escText(val)+'</t></is></c>';
}
function buildSheetData(ctx,sheet){
  var rows=ctx?ctx.rows:{};
  var idxSet={};
  for(var rk in rows)idxSet[rk]=1;
  for(var k in sheet.cells){var p=k.split(':');idxSet[p[0]]=1;}
  var rl=Object.keys(idxSet).map(Number).sort(function(a,b){return a-b;});
  var body='';
  rl.forEach(function(r){
    var orig=rows[r];
    var colMap={};
    var pushC=function(col,markup){colMap[col]=markup;};
    if(orig){
      for(var addr in orig.cells){
        var p=XLSXF.addrRC(addr);if(!p)continue;
        var ourKey=r+':'+p.c;
        if(sheet.cleared[ourKey])continue;
        if(sheet.dirty[ourKey]&&sheet.cells[ourKey])continue;
        pushC(p.c,orig.cells[addr]);
      }
    }
    for(var k2 in sheet.cells){
      var p2=k2.split(':');if(+p2[0]!==r)continue;
      var c2=+p2[1];
      if(sheet.cleared[k2])continue;
      var cell=sheet.cells[k2];
      var origMarkup=null;
      if(orig){var oa=XLSX.utils.encode_cell({r:r,c:c2});if(orig.cells[oa])origMarkup=orig.cells[oa];}
      if(sheet.dirty[k2]||!origMarkup){
        if(cell.f||cell.v!=null||(cell&&hasFmt(cell)))pushC(c2,authoredCellXml(r,c2,cell,origMarkup,sheet.name));
      }
    }
    var cols=Object.keys(colMap).map(Number).sort(function(a,b){return a-b;});
    var rowXml=(orig?orig.tag:'<row r="'+(r+1)+'">');
    cols.forEach(function(cl){rowXml+=colMap[cl];});
    rowXml+='</row>';
    body+=rowXml;
  });
  return body;
}
function buildFreshSheetXml(s,tabSel){
  var maxR=0,maxC=0;
  for(var k in s.cells){var p=k.split(':');maxR=Math.max(maxR,+p[0]);maxC=Math.max(maxC,+p[1]);}
  var ref=(maxR||maxC)?XLSX.utils.encode_range({s:{r:0,c:0},e:{r:maxR,c:maxC}}):'A1';
  var cols='';
  var anyW=false;
  for(var i=0;i<s.colW.length;i++){if(s.colW[i]!==DEFW)anyW=true;}
  if(anyW){
    cols='<cols>';
    for(var j=0;j<s.colW.length;j++){var w=s.colW[j];if(w===DEFW)continue;cols+='<col min="'+(j+1)+'" max="'+(j+1)+'" width="'+Math.max(5,Math.round(w/7*10)/10)+'" customWidth="1"/>';}
    cols+='</cols>';
  }
  var head='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="'+XLSXF.NS_R+'">'+
    '<dimension ref="'+ref+'"/>'+
    '<sheetViews><sheetView workbookViewId="0"'+(tabSel?' tabSelected="1"':'')+'/></sheetViews>'+
    '<sheetFormatPr defaultRowHeight="15"/>'+cols+'<sheetData>';
  return head+buildSheetData(null,s)+'</sheetData></worksheet>';
}
function rebuildSheetXml(s){
  var oo=s.oo;
  if(!oo)return buildFreshSheetXml(s,s.name===active);
  var body=buildSheetData(oo,s);
  var maxR=0,maxC=0;
  for(var k in s.cells){var p=k.split(':');maxR=Math.max(maxR,+p[0]);maxC=Math.max(maxC,+p[1]);}
  for(var rk in oo.rows){var rr=+rk;maxR=Math.max(maxR,rr);for(var a in oo.rows[rk].cells){var pp=XLSXF.addrRC(a);if(pp){maxR=Math.max(maxR,pp.r);maxC=Math.max(maxC,pp.c);}}}
  var ref=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(0,maxR),c:Math.max(0,maxC)}});
  var head=oo.head.replace(/<dimension[^>]*\/>/, '<dimension ref="'+ref+'"/>');
  return head+'<sheetData>'+body+'</sheetData>'+oo.tail;
}
function buildSurgicalXLSX(){
  ensureStyleReg();
  var usedParts={},removedParts={};
  order.forEach(function(name){var s=sheets[name];if(s.oo&&s.oo.path)usedParts[s.oo.path]=1;});
  OO.entries.forEach(function(e){
    if(/^xl\/worksheets\/sheet\d+\.xml$/.test(e.name)&&!usedParts[e.name])removedParts[e.name]=1;
  });
  OO.entries.forEach(function(e){
    if(/^xl\/worksheets\/sheet\d+\.xml\.rels$/.test(e.name)){
      var base=e.name.slice(0,-5);
      if(removedParts[base])removedParts[e.name]=1;
    }
  });
  var maxSheetN=0;
  OO.entries.forEach(function(e){var m=/^xl\/worksheets\/sheet(\d+)\.xml$/.exec(e.name);if(m)maxSheetN=Math.max(maxSheetN,+m[1]);});
  var maxWbRid=0;
  if(OO.relsXml){var rm=OO.relsXml.match(/Id="rId(\d+)"/g)||[];for(var qi=0;qi<rm.length;qi++)maxWbRid=Math.max(maxWbRid,+rm[qi].match(/\d+/)[0]);}
  var newPartN=maxSheetN,allocated=[];
  var sheetXmls={};
  var wbSheets=[];
  order.forEach(function(name){
    var s=sheets[name];
    if(s.oo&&s.oo.path){
      sheetXmls[s.oo.path]=rebuildSheetXml(s);
      wbSheets.push({name:name,rid:s.oo.rid,sheetId:(s.oo.sheetId||order.indexOf(name)+1)});
    }else{
      newPartN++;
      var partName='sheet'+newPartN+'.xml';
      var rid='rId'+(++maxWbRid);
      allocated.push({partName:partName,rid:rid});
      var path='xl/worksheets/'+partName;
      sheetXmls[path]=buildFreshSheetXml(s,name===active);
      wbSheets.push({name:name,rid:rid,sheetId:order.indexOf(name)+1});
    }
  });
  var wbXml=XLSXF.rebuildSheetsBlock(OO.wbXml,wbSheets);
  var relsXml=OO.relsXml?XLSXF.rewriteRels(OO.relsXml,usedParts,allocated):null;
  var ctXml=OO.ctXml?XLSXF.rewriteContentTypes(OO.ctXml,removedParts,allocated):null;
  var stylesXml=null;
  if(STY&&STY.order.length){
    stylesXml=OO.stylesXml?XLSXF.patchStyles(OO.stylesXml,STY):XLSXF.freshStylesXml(STY);
  }
  var build=[];
  OO.entries.forEach(function(e){
    if(removedParts[e.name])return;
    var out;
    if(e.name==='xl/workbook.xml')out={name:e.name,data:TE2(wbXml),method:0};
    else if(e.name==='xl/_rels/workbook.xml.rels'&&relsXml)out={name:e.name,data:TE2(relsXml),method:0};
    else if(e.name==='[Content_Types].xml'&&ctXml)out={name:e.name,data:TE2(ctXml),method:0};
    else if(e.name==='xl/styles.xml'&&stylesXml)out={name:e.name,data:TE2(stylesXml),method:0};
    else if(sheetXmls[e.name])out={name:e.name,data:TE2(sheetXmls[e.name]),method:0};
    else out={name:e.name,data:OO.bytes.subarray(e.dataStart,e.dataStart+e.compSize),method:e.method,crc:e.crc,compSize:e.compSize,uncompSize:e.uncompSize,_raw:true};
    build.push(out);
  });
  allocated.forEach(function(an){
    var path='xl/worksheets/'+an.partName;
    build.push({name:path,data:TE2(sheetXmls[path]),method:0});
  });
  return XLSXF.zipBuild(build);
}
function buildFreshXLSX(){
  ensureStyleReg();
  var allocated=[],sheetsXml={};
  order.forEach(function(name){
    var s=sheets[name];
    var partName='sheet'+(order.indexOf(name)+1)+'.xml';
    allocated.push(partName);
    sheetsXml[partName]=buildFreshSheetXml(s,name===active);
  });
  var wbSheets=order.map(function(name,i){return {name:name,rid:'rId'+(i+1),sheetId:i+1};});

    allocated.map(function(a){return '<Override PartName="/xl/worksheets/'+a+'" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';}).join('')+
    '</Types>';
  var rels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="'+XLSXF.NS_PKG_REL+'"><Relationship Id="rId" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>';
  var wbXml3='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="'+XLSXF.NS_R+'"><sheets>'+
    wbSheets.map(function(s){return '<sheet name="'+XLSXF.escAttr(s.name)+'" sheetId="'+s.sheetId+'" r:id="'+s.rid+'"/>';}).join('')+
    '</sheets></workbook>';
  var wbRels='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="'+XLSXF.NS_PKG_REL+'">'+
    wbSheets.map(function(s,i){return '<Relationship Id="'+s.rid+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/'+allocated[i]+'"/>';}).join('')+
    '<Relationship Id="rId'+(wbSheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+
    '</Relationships>';
  var build=[
    {name:'[Content_Types].xml',data:TE2(ct),method:0},
    {name:'_rels/.rels',data:TE2(rels),method:0},
    {name:'xl/workbook.xml',data:TE2(wbXml3),method:0},
    {name:'xl/_rels/workbook.xml.rels',data:TE2(wbRels),method:0},
    {name:'xl/styles.xml',data:TE2(stylesXml),method:0}

function numfmtToZ(nf){
  switch(nf){
    case 'number':return'#,##0.00';
    case 'int':return'0';
    case 'percent':return'0.00%';
    case 'currency':return'$#,##0.00';
    case 'date':return'yyyy-mm-dd';
    default:return undefined;
  }
}
function datestamp(){var d=new Date();function p(n){return(n<10?'0':'')+n;}return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());}
function exportCSV(){
  var s=sheets[active];
  var data=[];
  var maxR=0,maxC=0;
  Object.keys(s.cells).forEach(function(k){var p=k.split(':');maxR=Math.max(maxR,parseInt(p[0],10));maxC=Math.max(maxC,parseInt(p[1],10));});
  for(var r=0;r<=maxR;r++){
    var row=[];
    for(var c=0;c<=maxC;c++){
      var v=resolve(active,r,c);
      if(isErr(v))row.push('#'+v.__e.replace('#',''));
      else if(v==null)row.push('');
      else if(v instanceof Date)row.push(v.toLocaleDateString());
      else if(typeof v==='number')row.push(v);
      else if(typeof v==='boolean')row.push(v?'TRUE':'FALSE');
      else row.push(v);
    }
    data.push(row);
  }
  var ws=XLSX.utils.aoa_to_sheet(data);
  var csv=XLSX.utils.sheet_to_csv(ws);
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='sheet-'+active+'-'+datestamp()+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  toast('CSV exported');
}
function printSheet(){
  var p=window.open('','_blank');
  if(!p){toast('Popup blocked');return;}
  var s=sheets[active];
  var maxR=Math.min(s.nr-1,200),maxC=Math.min(s.colW.length-1,40);
  Object.keys(s.cells).forEach(function(k){var q=k.split(':');maxR=Math.max(maxR,parseInt(q[0],10));maxC=Math.max(maxC,parseInt(q[1],10));});

  h+='<tr><th></th>';

      var v=resolve(active,r,cc);

function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ====================================================================
   KEYBOARD
   ==================================================================== */
function handleKey(e){
  var mod=e.ctrlKey||e.metaKey;
  if(mod){
    var key=e.key.toLowerCase();
    if(key==='z'&&!e.shiftKey){e.preventDefault();undo();return true;}
    if(key==='y'||(key==='z'&&e.shiftKey)){e.preventDefault();redo();return true;}
    if(key==='s'){e.preventDefault();exportXLSX();return true;}
    if(key==='o'){e.preventDefault();ui.openFile.click();return true;}
    if(key==='c'){e.preventDefault();copySelection();return true;}
    if(key==='v'){e.preventDefault();pasteSelection();return true;}
    if(key==='b'){e.preventDefault();applyFmt('b',fmtState().b?null:1);return true;}
    if(key==='i'&&document.activeElement!==ui.fxInput){e.preventDefault();applyFmt('i',fmtState().i?null:1);return true;}
    if(key==='u'){e.preventDefault();applyFmt('u',fmtState().u?null:1);return true;}
    if(key==='a'){e.preventDefault();selectAllGrid();return true;}
    return false;
  }
  if(editing)return false;
  var r=selRect();
  var handled=true;
  switch(e.key){
    case 'ArrowUp': if(e.shiftKey){cursor.r=Math.max(0,cursor.r-1);var rcu=realCell(sheets[active],cursor.r,cursor.c);cursor.r=rcu.r;cursor.c=rcu.c;}else{moveSel(-1,0);} updateFx();updateStatus();drawSelection();scrollCellIntoView(cursor.r,cursor.c);break;
    case 'ArrowDown':if(e.shiftKey){cursor.r=Math.min(sheets[active].nr-1,cursor.r+1);var rcd=realCell(sheets[active],cursor.r,cursor.c);cursor.r=rcd.r;cursor.c=rcd.c;}else{moveSel(1,0);} updateFx();updateStatus();drawSelection();scrollCellIntoView(cursor.r,cursor.c);break;
    case 'ArrowLeft':if(e.shiftKey){cursor.c=Math.max(0,cursor.c-1);var rcl=realCell(sheets[active],cursor.r,cursor.c);cursor.r=rcl.r;cursor.c=rcl.c;}else{moveSel(0,-1);} updateFx();updateStatus();drawSelection();scrollCellIntoView(cursor.r,cursor.c);break;
    case 'ArrowRight':if(e.shiftKey){cursor.c=Math.min(sheets[active].colW.length-1,cursor.c+1);var rcr=realCell(sheets[active],cursor.r,cursor.c);cursor.r=rcr.r;cursor.c=rcr.c;}else{moveSel(0,1);} updateFx();updateStatus();drawSelection();scrollCellIntoView(cursor.r,cursor.c);break;
    case 'Enter': if(e.shiftKey)moveSel(-1,0);else moveSel(1,0);break;
    case 'Tab': moveSel(0,e.shiftKey?-1:1);break;
    case 'Delete':case 'Backspace':deleteSelection();break;
    case 'F2':startEdit(anchor.r,anchor.c);break;
    case 'Home':if(e.shiftKey){cursor.c=0;}else{anchor.c=0;cursor={r:anchor.r,c:0};}updateFx();updateStatus();drawSelection();break;
    case ' ':e.preventDefault();startEdit(anchor.r,anchor.c);break;
    default:
      handled=false;
  }
  if(handled&&(e.key.length===1||['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Delete','Backspace','Enter','Tab','Home'].indexOf(e.key)>=0))e.preventDefault();
  e.stopPropagation();
  return handled;
}
function onPrintableKey(e){
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(editing)return;
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT'))return;
  if(e.key.length===1&&!e.key.match(/[\x00-\x1F]/)){
    e.preventDefault();
    var cell=getCell(anchor.r,anchor.c);
    var cur=cell?(cell.f?'='+cell.f:plainString(cell.v)):'';
    startEdit(anchor.r,anchor.c,cur+e.key);
  }
}

/* ====================================================================
   APPLY FORMAT (toolbar)
   ==================================================================== */
function applyFmt(prop,val){
  snap();
  var r=selRect();
  for(var i=r.r0;i<=r.r1;i++)for(var j=r.c0;j<=r.c1;j++){
    var cell=getOrMakeCell(i,j);
    if(val===null||val===undefined||val===''||val==='#ffffff'){
      delete cell[prop];
    }else cell[prop]=val;
    if(!cell.f&&cell.v==null&&!hasFmt(cell))delete sheets[active].cells[key(i,j)];
    else if(sheets[active].oo)markDirty(i,j);
  }
  bustCache();renderGrid();syncFmtUI();saveSessionSoon();
}

/* ====================================================================
   INIT
   ==================================================================== */
function bindUI(){
  ui.menubar=$('menubar');ui.btnNew=$('btnNew');ui.btnOpen=$('btnOpen');ui.btnSave=$('btnSave');
  ui.fileName=$('fileName');
  ui.btnCSV=$('btnCSV');ui.btnPrint=$('btnPrint');ui.btnUndo=$('btnUndo');ui.btnRedo=$('btnRedo');
  ui.saved=$('savedState');ui.btnBold=$('btnBold');ui.btnItalic=$('btnItalic');ui.btnUnderline=$('btnUnderline');
  ui.fontColor=$('fontColor');ui.fillColor=$('fillColor');ui.btnLeft=$('btnLeft');ui.btnCenter=$('btnCenter');
  ui.btnRight=$('btnRight');ui.numFmt=$('numFmt');ui.btnClearFmt=$('btnClearFmt');
  ui.cellRef=$('cellRef');ui.fxInput=$('fxInput');
  ui.corner=$('corner');ui.colHead=$('colHead');ui.rowHead=$('rowHead');ui.scroller=$('scroller');ui.canvas=$('canvas');ui.viewport=$('viewport');ui.frzCorner=$('frzCorner');ui.frzTop=$('frzTop');ui.frzLeft=$('frzLeft');ui.colHeadFrozen=$('colHeadFrozen');ui.rowHeadFrozen=$('rowHeadFrozen');
  ui.tabs=$('tabs');ui.addTab=$('addTab');ui.stCell=$('stCell');ui.stSize=$('stSize');
  ui.btnMoreRows=$('btnMoreRows');ui.openFile=$('openFile');ui.toast=$('toast');
  ui.restoreBanner=$('restoreBanner');ui.btnRestore=$('btnRestore');ui.btnDiscard=$('btnDiscard');

  ui.btnNew.addEventListener('click',function(){if(confirm('New workbook? Unsaved changes are lost.')){newWorkbook();buildTabs();renderAll();saveSessionNow();}});
  ui.btnOpen.addEventListener('click',function(){ui.openFile.click();});
  ui.btnSave.addEventListener('click',exportXLSX);
  ui.btnCSV.addEventListener('click',exportCSV);
  ui.btnPrint.addEventListener('click',printSheet);
  ui.btnUndo.addEventListener('click',undo);
  ui.btnRedo.addEventListener('click',redo);
  ui.openFile.addEventListener('change',function(e){
    if(e.target.files&&e.target.files[0])importFile(e.target.files[0]);
    e.target.value='';
  });
  ui.btnBold.addEventListener('click',function(){applyFmt('b',fmtState().b?null:1);});
  ui.btnItalic.addEventListener('click',function(){applyFmt('i',fmtState().i?null:1);});
  ui.btnUnderline.addEventListener('click',function(){applyFmt('u',fmtState().u?null:1);});
  ui.fontColor.addEventListener('input',function(){applyFmt('color',ui.fontColor.value);});
  ui.fillColor.addEventListener('input',function(){applyFmt('fill',ui.fillColor.value);});
  ui.btnLeft.addEventListener('click',function(){applyFmt('align',fmtState().align==='left'?null:'left');});
  ui.btnCenter.addEventListener('click',function(){applyFmt('align',fmtState().align==='center'?null:'center');});
  ui.btnRight.addEventListener('click',function(){applyFmt('align',fmtState().align==='right'?null:'right');});
  ui.numFmt.addEventListener('change',function(){applyFmt('numfmt',ui.numFmt.value||null);});
  ui.btnClearFmt.addEventListener('click',function(){snap();var r=selRect();for(var i=r.r0;i<=r.r1;i++)for(var j=r.c0;j<=r.c1;j++){var c=getCell(i,j);if(c){['b','i','u','color','fill','align','numfmt'].forEach(function(k){delete c[k];});if(!c.f&&c.v==null)delete sheets[active].cells[key(i,j)];else markDirty(i,j);}}bustCache();renderGrid();syncFmtUI();saveSessionSoon();});

  ui.corner.addEventListener('mousedown',function(e){selectAllGrid();});
  ui.addTab.addEventListener('click',addSheetUI);
  ui.btnMoreRows.addEventListener('click',function(){
    sheets[active].nr=Math.min(MAX_ROWS,sheets[active].nr+100);
    renderAll();
  renderFrozenCells();saveSessionNow();toast('Rows added');
  });

  ui.fxInput.addEventListener('keydown',function(e){
    if(e.key==='Enter'){e.preventDefault();this.blur();commitFx();moveSel(1,0);}
    if(e.key==='Escape'){this.value=persistFx;this.blur();}
    if(e.key==='Tab'){e.preventDefault();this.blur();commitFx();moveSel(0,1);}
  });
  ui.fxInput.addEventListener('blur',commitFx);

  /* canvas mouse */
  var dragSel=false;
  ui.scroller.addEventListener('mousedown',function(e){
    if(document.activeElement===ui.fxInput)ui.fxInput.blur(); /* commit fx bar entry first */
    if(e.target===ui.canvas||e.target===ui.scroller||(e.target.classList&&e.target.classList.contains('cell'))){
      var c=cellFromEvent(e);
      selectCell(c.r,c.c,e,e.shiftKey);
      dragSel=true;
      function onMove(ev){
        if(!dragSel)return;
        var d=cellFromEvent(ev);
        cursor.r=d.r;cursor.c=d.c;
        drawSelection();
        updateFx();updateStatus();
      }
      function onUp(){
        dragSel=false;
        document.removeEventListener('mousemove',onMove);
        document.removeEventListener('mouseup',onUp);
      }
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
    }
  });
  ui.scroller.addEventListener('dblclick',function(e){
    if(e.target.classList&&e.target.classList.contains('cell')){
      var c=cellFromEvent(e);
      anchor.r=c.r;anchor.c=c.c;cursor.r=c.r;cursor.c=c.c;
      startEdit(anchor.r,anchor.c);
    }
  });
  ui.scroller.addEventListener('scroll',syncScroll);ui.viewport.addEventListener('scroll',syncScroll);
  ui.colHead.addEventListener('scroll',function(){});
  ui.rowHead.addEventListener('scroll',function(){});
  window.addEventListener('resize',debounce(function(){renderGrid();},80));

  document.addEventListener('keydown',handleKey);
  document.addEventListener('keypress',onPrintableKey);

  ui.btnRestore.addEventListener('click',function(){
    var data=loadSession();if(data){restoreFromData(data);buildTabs();renderAll();toast('Session restored');}
    ui.restoreBanner.classList.remove('show');
  });
  ui.btnDiscard.addEventListener('click',function(){
    try{localStorage.removeItem(LS_KEY);}catch(e){}
    ui.restoreBanner.classList.remove('show');
    newWorkbook();buildTabs();renderAll();
  });
}

function fatalSetup(msg){
  var html='<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:#f6f8fa;z-index:99999;display:flex;align-items:center;justify-content:center;font-family:Segoe UI,Arial,sans-serif;padding:20px;">'
    +'<div style="max-width:620px;background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:24px 28px;box-shadow:0 8px 30px rgba(0,0,0,.12);">'
    +'<h2 style="margin:0 0 10px;color:#d1242f;font-size:18px;">Cyberville Offline Excel can\u2019t start (v'+APP_VERSION+')</h2>'
    +'<p style="margin:0 0 12px;line-height:1.5;">'+msg+'</p>'
    +'<p style="margin:0;color:#57606a;font-size:13px;line-height:1.5;">Fix: unzip the ExcelOffline folder again and keep <b>index.html</b> and the <b>lib</b> folder together. Then double-click <b>index.html</b>. If it still fails, open the Developer Console (F12) and note the red error.</p>'
    +'</div></div>';
  var d=document.createElement('div');
  d.innerHTML=html;
  (document.body||document.documentElement).appendChild(d);
}
function init(){
  try{
    if(typeof XLSX==='undefined'&&typeof XLSXF==='undefined'){
      fatalSetup('Both core library files are missing, so the app cannot read or save files. The <b>lib</b> folder is not next to <b>index.html</b>.');
      return;
    }
    if(typeof XLSX==='undefined'){fatalSetup('The library <b>lib/xlsx.full.min.js</b> failed to load (missing or the wrong version).');return;}
    if(typeof XLSXF==='undefined'){fatalSetup('The library <b>lib/ooxml.js</b> failed to load (missing or the wrong version).');return;}
    bindUI();
    var saved=loadSession();
    if(saved&&saved.sheets&&Object.keys(saved.sheets).length){
      /* ask user: restore or fresh */
      ui.restoreBanner.classList.add('show');
      /* don't auto-load yet; keep empty workbook until choice */
      newWorkbook();
    }else{
      newWorkbook();
    }
    buildTabs();renderAll();
    ui.saved.textContent='Ready';
  }catch(err){
    try{fatalSetup('Startup error: '+err.message)}catch(_){}
    try{console.error(err)}catch(_){}
  }
}
(window.APP_VERSION=APP_VERSION,window.__noStyleDeps=false);
init();
</script>
<script>
(function(){
  var deferredPrompt=null;
  var shown=false;
  function showInstall(){var b=document.querySelector('#btnInstall');if(b&&b.style)b.style.display='';}
  function hideInstall(){var b=document.querySelector('#btnInstall');if(b&&b.style)b.style.display='none';}
  if('serviceWorker' in navigator){
    window.addEventListener('load',function(){
      navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(e){try{console.error('SW registration failed',e);}catch(_){}});
    });
  }
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;showInstall();});
  window.addEventListener('appinstalled',function(){deferredPrompt=null;hideInstall();});
  document.addEventListener('click',function(ev){
    var t=ev.target,id=(t&&t.id)||'';
    if(id==='btnInstall'){
      ev.preventDefault();
      if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(function(){deferredPrompt=null;hideInstall();}).catch(function(){});}
    }
  });
  if(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches){hideInstall();}
})();
</script>
